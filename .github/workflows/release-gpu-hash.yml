name: NVIDIA hash release artifacts

on:
  workflow_dispatch:
  pull_request:
    branches: [MINER]
    paths:
      - '.github/workflows/release-gpu-hash.yml'
      - 'BUILD.md'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'COPYING'
      - 'README.md'
      - 'cmake/**'
      - 'src/**'
      - 'include/**'
      - 'configs/**'
      - 'example.miner.config'
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux:
    name: NVIDIA CUDA hash (linux-x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA toolkit and dependencies
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libssl-dev cuda-nvcc-12-8 cuda-cudart-dev-12-8 cuda-profiler-api-12-8 cuda-cuobjdump-12-8
      - name: Configure
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/cuda-hash -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DWITH_PRIME=OFF -DWITH_GPU_CUDA=ON -DNEXUSMINER_STATIC_OPENSSL=OFF \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc \
            '-DCMAKE_CUDA_ARCHITECTURES=61;75;80;86;89;90' 2>&1 | tee configure.log
          grep -q 'CUDA compiler identification is NVIDIA' configure.log
          grep -qx 'WITH_PRIME:BOOL=OFF' build/cuda-hash/CMakeCache.txt
      - name: Build and host tests
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/cuda-hash --parallel 2
          /usr/local/cuda-12.8/bin/cuobjdump --list-elf build/cuda-hash/NexusMiner | tee cuda-architectures.log
          for arch in 61 75 80 86 89 90; do grep -q "sm_$arch" cuda-architectures.log; done
          ctest --test-dir build/cuda-hash --output-on-failure --timeout 120
      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          version=$(build/cuda-hash/NexusMiner --version | sed -n 's/^NexusMiner version: //p')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          name="NexusMiner-$version-linux-x86_64-nvidia-cuda-hash-only"
          mkdir -p "dist/$name/third-party-licenses"
          cp build/cuda-hash/NexusMiner README.md BUILD.md COPYING example.miner.config "dist/$name/"
          cp -R configs "dist/$name/"
          cp build/cuda-hash/_deps/spdlog-src/LICENSE "dist/$name/third-party-licenses/spdlog.txt"
          cp build/cuda-hash/_deps/nlohmann_json-src/LICENSE.MIT "dist/$name/third-party-licenses/nlohmann-json.txt"
          cp build/cuda-hash/_deps/asio-src/asio/COPYING "dist/$name/third-party-licenses/asio.txt"
          cp build/cuda-hash/_deps/asio-src/asio/LICENSE_1_0.txt "dist/$name/third-party-licenses/boost.txt"
          curl -fsSL https://docs.nvidia.com/cuda/archive/12.8.0/eula/index.html > "dist/$name/third-party-licenses/nvidia-cuda-eula.html"
          git rev-parse HEAD > "dist/$name/SOURCE_COMMIT.txt"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: nvidia-cuda-hash-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error

  windows:
    name: NVIDIA CUDA hash (windows-x86_64)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: Jimver/cuda-toolkit@6008063726ffe3309d1b22e413d9e88fed91a2f2 # v0.2.29
        with:
          cuda: '12.8.0'
          method: network
          sub-packages: '["nvcc", "cudart", "visual_studio_integration", "cuobjdump"]'
      - name: Install vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE\vcpkg"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:GITHUB_WORKSPACE\vcpkg" checkout c4c072aa5c128adf3f63715e03ba707f81b5b8e5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache@v4
        with:
          path: vcpkg/installed
          key: windows-2022-vcpkg-c4c072aa-x64-windows-openssl-gmp-boost
      - name: Install OpenSSL
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\vcpkg\vcpkg.exe" install --triplet x64-windows openssl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --preset windows-msvc "-DCMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DWITH_PRIME=OFF -DWITH_GPU_CUDA=ON -DNEXUSMINER_STATIC_OPENSSL=OFF "-DCMAKE_CUDA_ARCHITECTURES=61;75;80;86;89;90" 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Quiet -Path configure.log -Pattern 'CUDA compiler identification is NVIDIA')) { throw 'CUDA compiler is missing' }
          if (-not (Select-String -Quiet -Path build/windows-msvc/CMakeCache.txt -Pattern '^WITH_PRIME:BOOL=OFF$')) { throw 'Prime support is unexpectedly enabled' }
      - name: Build and host tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build --preset windows-msvc --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $architectures = & "$env:CUDA_PATH\bin\cuobjdump.exe" --list-elf build/windows-msvc/Release/NexusMiner.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $architectures
          foreach ($arch in 61, 75, 80, 86, 89, 90) {
            if (-not ($architectures -match "sm_$arch")) { throw "Missing CUDA architecture sm_$arch" }
          }
          $env:PATH = "$env:GITHUB_WORKSPACE\vcpkg\installed\x64-windows\bin;$env:PATH"
          ctest --test-dir build/windows-msvc -C Release --output-on-failure --timeout 120
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$env:GITHUB_WORKSPACE\vcpkg\installed\x64-windows\bin;$env:PATH"
          $version = (& build/windows-msvc/Release/NexusMiner.exe --version)
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^NexusMiner version: (\d+\.\d+\.\d+)$') { throw "Unexpected version: $version" }
          $name = "NexusMiner-$($Matches[1])-windows-x86_64-nvidia-cuda-hash-only"
          New-Item -ItemType Directory -Force "dist\$name\third-party-licenses" | Out-Null
          Copy-Item build/windows-msvc/Release/NexusMiner.exe, README.md, BUILD.md, COPYING, example.miner.config "dist\$name"
          Copy-Item configs "dist\$name\configs" -Recurse
          Copy-Item vcpkg/installed/x64-windows/bin/libcrypto-3-x64.dll, vcpkg/installed/x64-windows/bin/libssl-3-x64.dll "dist\$name"
          Copy-Item build/windows-msvc/_deps/spdlog-src/LICENSE "dist\$name\third-party-licenses\spdlog.txt"
          Copy-Item build/windows-msvc/_deps/nlohmann_json-src/LICENSE.MIT "dist\$name\third-party-licenses\nlohmann-json.txt"
          Copy-Item build/windows-msvc/_deps/asio-src/asio/COPYING "dist\$name\third-party-licenses\asio.txt"
          Copy-Item build/windows-msvc/_deps/asio-src/asio/LICENSE_1_0.txt "dist\$name\third-party-licenses\boost.txt"
          Copy-Item vcpkg/installed/x64-windows/share/openssl/copyright "dist\$name\third-party-licenses\openssl.txt"
          Invoke-WebRequest -Uri https://docs.nvidia.com/cuda/archive/12.8.0/eula/index.html -OutFile "dist\$name\third-party-licenses\nvidia-cuda-eula.html"
          git rev-parse HEAD | Set-Content -Encoding ascii "dist\$name\SOURCE_COMMIT.txt"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $stagedVersion = (& "dist\$name\NexusMiner.exe" --version)
          if ($LASTEXITCODE -ne 0 -or $stagedVersion -ne $version) { throw "Staged executable failed: $stagedVersion" }
          Compress-Archive -Path "dist\$name" -DestinationPath "dist\$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist\$name.zip").Hash.ToLower()
          "$hash  $name.zip" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nvidia-cuda-hash-windows-x86_64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
