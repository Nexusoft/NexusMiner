name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Ensure CPM cache directory exists
        env:
          CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
        run: mkdir -p "${CPM_SOURCE_CACHE}"

      - name: Restore CPM dependencies cache
        id: cpm-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.cpm-cache
          key: copilot-cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', 'CMakePresets.json') }}
          restore-keys: |
            copilot-cpm-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev

      - name: Warm debug configure
        env:
          CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
        run: cmake --preset debug

      - name: Save CPM dependencies cache
        if: steps.cpm-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.cpm-cache
          key: ${{ steps.cpm-cache-restore.outputs.cache-primary-key }}
