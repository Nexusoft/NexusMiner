    "_section_usage": "======================= USAGE EXAMPLES ===========================",
    "_usage_notes": [
        "================================================================",
        "GETTING STARTED:",
        "================================================================",
        "1. Generate Falcon keys:",
        "   ./NexusMiner --create-keys",
        "",
        "2. Get Tritium genesis hash:",
        "   nexus list accounts",
        "",
        "3. Whitelist miner on Nexus node:",
        "   Add to nexus.conf: -minerallowkey=<your_falcon_pubkey>",
        "   Restart Nexus node",
        "",
        "================================================================",
        "MULTI-CORE CPU MINING:",
        "================================================================",
        "For N-core CPU, create N workers (1 thread each):",
        "- 4-core: 3-4 workers (leave 1 core for system)",
        "- 8-core: 6-7 workers",
        "- 16-core: 12-14 workers",
        "- 32-core: 24-28 workers",
        "- 64-core: 48-56 workers",
        "- 128-core Threadripper: 96-112 workers",
        "",
        "================================================================",
        "MULTI-GPU MINING:",
        "================================================================",
        "Create one worker per GPU with device index:",
        "{\"worker\": {\"id\": \"gpu0\", \"mode\": {\"hardware\": \"gpu\", \"device\": 0}}}",
        "{\"worker\": {\"id\": \"gpu1\", \"mode\": {\"hardware\": \"gpu\", \"device\": 1}}}",
        "{\"worker\": {\"id\": \"gpu2\", \"mode\": {\"hardware\": \"gpu\", \"device\": 2}}}",
        "",
        "================================================================",
        "POWER EFFICIENCY:",
        "================================================================",
        "GPU power_limit_percent recommendations:",
        "- Maximum performance: 100%",
        "- Balanced: 80-85% (best efficiency/performance ratio)",
        "- Efficiency focused: 70-75% (lower power, moderate hashrate)",
        "- Ultra-efficient: 50-65% (minimal power consumption)",
        "",
        "================================================================",
        "REMOTE/VPN MINING:",
        "================================================================",
        "- Set wallet_ip to node's IP/hostname",
        "- Set local_ip to 0.0.0.0 (binds to all interfaces)",
        "- TLS and ChaCha20 auto-enable for non-localhost",
        "- Consider using VPN for security if mining over internet",
        "",
        "================================================================",
        "COMMENTS:",
        "================================================================",
        "Fields starting with '_' are comments (ignored by parser).",
        "You can add your own comments with any _fieldname.",
        "",
        "================================================================"
    ]
