# NexusMiner Configuration File
# TOML format - much easier to read and edit than JSON
# Solo Prime Mining Example

[wallet]
ip = "127.0.0.1"
port = 8323

[network]
# Local bind address (default: 0.0.0.0 = all interfaces)
local_ip = "0.0.0.0"

# Keepalive interval in hours (default: 12 = twice per day)
keepalive_interval = 12

[mining]
# Channel: 1 = Prime, 2 = Hash
channel = 1

# Genesis hash for Falcon authentication (from your Nexus wallet)
# Get this from your wallet with: system/get/info
genesis = "a174011c93ca1c80bca5388382b167cacd33d3154395ea8f45ac99a8308cd122"

# Reward address - where mining rewards are sent (any valid NXS account)
# Get your genesis hash from: system/get/info (genesis field)
reward_address = "YOUR_GENESIS_HASH_HERE"  # 64-char hex genesis hash from system/get/info (same as genesis above; NOT a Base58 account address)

[workers]
# Number of CPU workers (typically set to number of CPU cores)
# For high thread count CPUs, you may want fewer workers with more threads each
count = 8

[cpu]
# Threads per worker (default: 1)
# For best performance, use 1 thread per worker
threads = 1

# Use efficiency cores on Intel hybrid CPUs (default: true)
efficiency_cores = true

# Prime mining backend selector (default: "workers")
#   "workers" — N independent single-threaded prime workers, each owning its
#               own Sieve and segment cursor.  Default for at least one
#               release after Stone 7 ships so any regression is one
#               config-line away from being reverted.
#   "engine"  — Stone 7: cooperative PrimeMiningEngine.  One engine per CPU
#               prime channel owns the consumer + pool sieve threads (auto-
#               derived from hardware concurrency).  Worker_prime instances
#               become thin adapters that carry stats and identity; found
#               blocks are credited to the lowest internal_id worker by
#               convention.  Look for "[PrimeMiningEngine]" lines on
#               startup to confirm the engine is live.
engine_mode = "workers"

[logging]
# Log level: 0 = off, 1 = error, 2 = info, 3 = debug
level = 2
