{
    "version": 1,
    "wallet_ip": "mining.pool.com",
    "port": 8323,
    "local_ip": "0.0.0.0",
    "mining_mode": "PRIME",

    "miner_falcon_pubkey": "<YOUR_PUBKEY_HEX>",
    "miner_falcon_privkey": "<YOUR_PRIVKEY_HEX>",
    "enable_disposable_falcon": true,
    "tritium_genesis": "<YOUR_GENESIS_64_HEX>",

    "_comment": "Remote mining with TLS/HTTPS enabled",
    "_description": "Secure remote mining with encrypted connections and optional mutual TLS",

    "_section_tls": "TLS Configuration",
    "enable_tls": true,
    "tls_verify_peer": true,
    "tls_ca_cert_path": "",
    "tls_server_name": "mining.pool.com",

    "_section_mtls": "Mutual TLS (Optional - uncomment to use client certificates)",
    "_tls_client_cert_path": "/path/to/client-cert.pem",
    "_tls_client_key_path": "/path/to/client-key.pem",
    "_tls_client_key_password": "optional_password",

    "_section_enhanced": "Enhanced Security",
    "_comment_disposable_falcon": "Disposable Falcon signing is ALWAYS ON (core protocol, 0 blockchain overhead)",
    "_comment_chacha20": "ChaCha20 encryption is ALWAYS ON (core security)",
    "keepalive_interval": 12,

    "log_level": 2,
    "logfile": "remote_mining.log",
    "print_statistics_interval": 10,

    "stats_printers": [
        {"stats_printer": {"mode": "console"}},
        {"stats_printer": {"mode": "file", "filename": "stats.log"}}
    ],

    "workers": [
        {
            "worker": {
                "id": "gpu0",
                "mode": {
                    "hardware": "gpu",
                    "device": 0,
                    "power_limit_percent": 80,
                    "core_clock_offset": 0,
                    "memory_clock_offset": 0,
                    "fan_speed": 0,
                    "target_hashrate": 0
                }
            }
        }
    ]
}
