# ═══════════════════════════════════════════════════════════════
# NexusMiner - Stateless Mining Protocol Configuration
# Modern push-notification based mining (LLL-TAO PR #170)
# ═══════════════════════════════════════════════════════════════

[wallet]
# Node connection - use stateless mining port
ip = "127.0.0.1"
port = 8323  # Stateless protocol port (LLL-TAO 5.1.0+)

[network]
local_ip = "0.0.0.0"
# Keepalive to maintain session cache (1-168 hours)
keepalive_interval = 24

[mining]
# Mining channel: 1=Prime (CPU), 2=Hash (GPU/FPGA)
channel = 1

# Tritium Genesis Hash (required for stateless protocol)
# Get with: system/get/info in Nexus wallet
genesis = "YOUR_32_BYTE_GENESIS_HASH_HEX_64_CHARS"

# Reward Address (required for stateless protocol)
# Get with: system/get/info (genesis field — 64-char hex hash)
reward_address = "YOUR_GENESIS_HASH_HERE"  # 64-char hex genesis hash from system/get/info (same as genesis above; NOT a Base58 account address)

[falcon]
# Falcon-1024 public key (1793 bytes hex = 3586 hex chars)
# Or Falcon-512 public key (897 bytes hex = 1794 hex chars)
# Generate with: ./NexusMiner --create-keys
pubkey = "YOUR_FALCON_PUBLIC_KEY_HEX"

# Falcon private key - KEEP SECRET!
# Falcon-1024: 4609 bytes hex = 9218 hex chars
# Falcon-512: 2305 bytes hex = 4610 hex chars
privkey = "YOUR_FALCON_PRIVATE_KEY_HEX"

# REQUIRED: enables block signing (safe, upstream-compatible)
enable_disposable_falcon = true

[workers]
# Number of mining workers (adjust for your hardware)
# CPU Prime: use number of CPU cores
# GPU Hash: use number of GPUs
count = 8

[cpu]
# CPU mining settings (for Prime channel)
threads = 1  # Recommended: 1 thread per worker
efficiency_cores = true  # Use E-cores on hybrid CPUs

[logging]
# Log level: 0=trace, 1=debug, 2=info, 3=warn, 4=error, 5=critical
level = 2

# ═══════════════════════════════════════════════════════════════
# STATELESS PROTOCOL FEATURES
# ═══════════════════════════════════════════════════════════════
#
# ✅ AUTOMATIC FEATURES (no configuration needed):
# 
# 1. Genesis-First Authentication
#    - Genesis hash sent FIRST enables ChaCha20 key derivation
#    - No TLS certificates needed
#    - Session key = SHA256("nexus-mining-chacha20-v1" || genesis)
#
# 2. Push Notifications
#    - MINER_READY: Legacy 0xD8 or stateless 0xD0D8, framed with len4=0
#    - GET_BLOCK: Legacy 0x81 or stateless 0xD081 for initial template and updates
#    - No polling required!
#
# 3. Port-Selected Framing
#    - Port 8323: legacy 8-bit framing
#    - Port 9323+: stateless 16-bit mirror framing
#    - Wrong-lane packets disconnect instead of falling back
#
# 4. Session Management
#    - Unique session ID per connection
#    - Keepalive pings maintain session cache (default: 24 hours)
#    - Automatic session recovery on reconnection
#
# 5. ChaCha20 Encryption
#    - ALWAYS ON for session security
#    - Protects Falcon public key in transit (auto-enabled for remote)
#    - AAD (Additional Authenticated Data) protection
#
# ═══════════════════════════════════════════════════════════════
# EXPECTED LOG OUTPUT
# ═══════════════════════════════════════════════════════════════
#
# [Falcon Auth] ✅ Authentication successful
# [Falcon Auth]    Session ID: a1b2c3d4...
# [Solo Protocol] LEGACY/STATELESS LANE: Using push protocol
# [Solo Push] Sending MINER_READY
# [Solo] ✨ GET_BLOCK template received!
# [Solo]    Channel: 1 (Prime)
# [Solo]    Height: 4523891
# [Mining] ⛏️  Started mining on template...
#
# When blockchain advances:
# [Solo Push] 🔔 PRIME/HASH_BLOCK_AVAILABLE notification received!
# [Solo]    New height: 4523892
# [Mining] ⛏️  Switched to new template (< 10ms latency!)
#
# ═══════════════════════════════════════════════════════════════
# PERFORMANCE BENEFITS
# ═══════════════════════════════════════════════════════════════
#
# vs Legacy Polling Protocol:
# • Network traffic: 95% reduction (~100 bytes/block vs ~500 bytes/sec)
# • Template latency: 99% reduction (< 10ms vs 1-5 seconds)
# • CPU overhead: 95% reduction (event-driven vs polling loop)
# • Stale work: Near zero (instant updates vs polling delay)
#
# ═══════════════════════════════════════════════════════════════
# COMPATIBILITY
# ═══════════════════════════════════════════════════════════════
#
# Requires:
# • NexusMiner 1.5+ (this version)
# • LLL-TAO 5.1.0+ with PR #170 (for stateless support)
#
# Framing:
# • 8323 and 9323 use the same push behavior
# • Zero-payload opcodes require explicit 4-byte zero lengths
#
# ═══════════════════════════════════════════════════════════════
# SECURITY
# ═══════════════════════════════════════════════════════════════
#
# 1. Protect your private key:
#    chmod 600 miner.conf  # Linux/macOS
#
# 2. Never commit to version control:
#    Add miner.conf to .gitignore
#
# 3. Backup securely:
#    Store keys offline in encrypted storage
#
# 4. Remote mining:
#    Use enable_tls=true for encrypted connections
#
