{
    "version": 1,
    "wallet_ip": "127.0.0.1",
    "port": 8323,
    "local_ip": "127.0.0.1",
    "mining_mode": "PRIME",
    
    "connection_retry_interval": 5,
    "get_height_interval": 2,
    "ping_interval": 10,
    "log_level": 2,
    "logfile": "miner.log",
    
    "miner_falcon_pubkey": "<your_falcon_public_key_hex>",
    "miner_falcon_privkey": "<your_falcon_private_key_hex>",
    "enable_disposable_falcon": true,
    
    "tritium_genesis": "<your_32_byte_tritium_genesis_hash_hex>",
    "keepalive_interval": 12,
    "_comment_chacha20": "ChaCha20 encryption is ALWAYS ON (core security) - no configuration needed",
    "_comment_block_signing": "Disposable Falcon signing is ALWAYS ON (core protocol) - no configuration needed",
    
    "enable_tls": false,
    "tls_ca_cert_path": "",
    "tls_verify_peer": true,
    "tls_server_name": "",
    "tls_client_cert_path": "",
    "tls_client_key_path": "",
    "tls_client_key_password": "",
    
    "stats_printers": [
        {
            "stats_printer": {
                "mode": "console"
            }
        }
    ],
    
    "print_statistics_interval": 10,
    
    "workers": [
        {
            "worker": {
                "id": "cpu0",
                "mode": {
                    "hardware": "cpu"
                }
            }
        }
    ]
}
