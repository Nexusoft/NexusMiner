    "_section_settings_reference": "======================= SETTINGS REFERENCE =======================",
    
    "_ref_threads": "threads: 1-64 for HASH (multi-threading), 1 for PRIME (use multiple workers)",
    "_ref_affinity_mask": "affinity_mask: 0=auto, or bitmask (bit 0=core 0, bit 1=core 1, etc.)",
    "_ref_priority": "priority: 0=low, 1=below_normal, 2=normal, 3=above_normal, 4=high",
    "_ref_power_limit": "power_limit_percent: 50-100 (CPU power throttling)",
    "_ref_hyperthreading": "hyperthreading: true=use all logical cores, false=physical cores only",
    "_ref_efficiency_cores": "efficiency_cores: true=use all cores, false=P-cores only (hybrid CPUs)",
    "_ref_target_hashrate": "target_hashrate: 0=unlimited, or specify max hashrate",

    "_section_quick_start": "======================= QUICK START GUIDE =======================",
    
    "_quick_1": "1. Generate Falcon keys: ./NexusMiner --create-keys",
    "_quick_2": "2. Paste public and private keys above (miner_falcon_pubkey, miner_falcon_privkey)",
    "_quick_3": "3. Choose mining mode: Set 'mining_mode' to 'HASH' or 'PRIME'",
    "_quick_4_hash": "4. FOR HASH: Change cpu0 worker 'threads' to your CPU core count, DELETE cpu1-cpu7 workers",
    "_quick_4_prime": "4. FOR PRIME: Keep threads=1 for all workers, ADD/REMOVE workers to match your cores",
    "_quick_5": "5. Save this file as 'miner.conf'",
    "_quick_6": "6. Run: ./NexusMiner miner.conf",

