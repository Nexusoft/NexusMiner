    "_section_troubleshooting": "======================= TROUBLESHOOTING =======================",
    
    "_trouble_1": "Q: 'Failed to parse config file' → Check JSON syntax, no trailing commas",
    "_trouble_2": "Q: 'Invalid Falcon key format' → Ensure keys are valid hex from --create-keys",
    "_trouble_3": "Q: 'Failed to set thread priority' → Uncomment 'priority' and run as admin/root for levels 3-4",
    "_trouble_4": "Q: PRIME mining slow → Ensure 1 worker per core (8 cores = 8 workers)",
    "_trouble_5": "Q: HASH mining slow → Set threads=<cores> in cpu0, delete other workers",
    "_trouble_6": "Q: High CPU temp → Uncomment 'power_limit_percent': 80",
    "_trouble_7": "Q: System laggy → Uncomment 'priority': 2 or reduce worker count",
    
    "_section_performance_tips": "======================= PERFORMANCE TIPS =======================",
    
    "_tip_1": "✓ HASH mining: 1 worker with threads=<cores> (fastest)",
    "_tip_2": "✓ PRIME mining: N workers with threads=1 each (N=number of cores)",
    "_tip_3": "✓ Uncomment 'hyperthreading': false for more predictable performance",
    "_tip_4": "✓ Uncomment 'efficiency_cores': false on hybrid CPUs for better mining",
    "_tip_5": "✓ Leave 1-2 workers out on desktop PCs for system responsiveness",
    "_tip_6": "✓ Uncomment 'priority': 3 on dedicated mining rigs",
    "_tip_7": "✓ Monitor temps, uncomment 'power_limit_percent' if needed"
